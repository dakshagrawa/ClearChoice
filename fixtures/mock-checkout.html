<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mock checkout — ClearChoice</title>
  </head>
  <body>
    <main>
      <h1>Mock checkout</h1>
      <p>This is a local demonstration with fake products and no real customer, account, or payment data.</p>

      <section aria-labelledby="membership-heading">
        <h2 id="membership-heading">Mock membership</h2>
        <p>Membership renews automatically for $12 per month until cancelled.</p>
      </section>

      <section aria-labelledby="extras-heading">
        <h2 id="extras-heading">Mock extras</h2>
        <label><input type="checkbox" checked> Add purchase protection for $5</label>
        <label><input type="checkbox"> Add gift wrapping for $3</label>
      </section>
    </main>
  </body>
</html>
