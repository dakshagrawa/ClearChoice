<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynamic beta checkout — ClearChoice</title>
  </head>
  <body>
    <main>
      <h1>Dynamic beta checkout</h1>
      <p>This is a local demonstration with fake products and no real customer, account, or payment data.</p>
      <form id="fake-beta-checkout" action="#fake-order-confirmation">
        <label>Fake email <input name="fake-email" type="email" value="beta-customer@example.test"></label>
        <label>Fake card reference <input name="fake-card" type="text" value="fake-card-4242" disabled></label>
        <label><input name="fake-protection" type="checkbox" checked> Add fake purchase protection for $5</label>
        <label><input name="fake-gift-wrap" type="checkbox"> Add fake gift wrapping for $3</label>
        <label>Fake delivery speed
          <select name="fake-delivery"><option value="standard" selected>Fake standard delivery</option><option value="express">Fake express delivery</option></select>
        </label>
        <button id="fake-submit" type="submit">Place fake order</button>
      </form>
      <aside id="fake-order-summary"><h2>Order summary</h2><p>Beta membership renews automatically for $12 per month until cancelled.</p><p>Fake subtotal: $24</p></aside>
      <button id="replace-order-summary" type="button">Replace fake order summary</button>
      <a id="fake-fragment-control" href="#fake-delivery-details">View fake delivery details</a>
      <section id="fake-delivery-details"><h2>Fake delivery details</h2><p>Local fixture only.</p></section>
    </main>
    <script>
      document.querySelector('#replace-order-summary').addEventListener('click', () => {
        const orderSummary = document.querySelector('#fake-order-summary');
        const nextSummary = document.createElement('aside');
        nextSummary.id = 'fake-order-summary';
        const heading = document.createElement('h2');
        heading.textContent = 'Order summary updated';
        const renewal = document.createElement('p');
        renewal.textContent = 'Beta membership renews automatically for $12 per month until cancelled.';
        const subtotal = document.createElement('p');
        subtotal.textContent = 'Fake subtotal: $24';
        nextSummary.append(heading, renewal, subtotal);
        orderSummary.replaceWith(nextSummary);
      });
    </script>
  </body>
</html>
